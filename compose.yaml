services:
  sensitive-checker:
    image: ${SENSITIVE_CHECKER_IMAGE:-sensitive-checker:local}
    build:
      context: .
      target: runtime-cpu
    network_mode: host
    restart: unless-stopped
    environment:
      SERVICE_HOST: ${SERVICE_HOST:-127.0.0.1}
      SERVICE_PORT: ${SERVICE_PORT:-8000}
      COMPUTE_DEVICE: ${COMPUTE_DEVICE:-cpu}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/var/lib/sensitive-checker/music}
      MUSIC_ARTIFACT_MAX_SIZE: ${MUSIC_ARTIFACT_MAX_SIZE:-104857600}
      MUSIC_ARTIFACT_TTL_SECONDS: ${MUSIC_ARTIFACT_TTL_SECONDS:-900}
      MUSIC_PROCESS_TIMEOUT_SECONDS: ${MUSIC_PROCESS_TIMEOUT_SECONDS:-300}
      MUSIC_MAX_CONCURRENT_DOWNLOADS: ${MUSIC_MAX_CONCURRENT_DOWNLOADS:-2}
      MUSIC_CAPACITY_WAIT_SECONDS: ${MUSIC_CAPACITY_WAIT_SECONDS:-1}
      MUSIC_CLEANUP_INTERVAL_SECONDS: ${MUSIC_CLEANUP_INTERVAL_SECONDS:-60}
      IMAGE_UPLOAD_MAX_SIZE: ${IMAGE_UPLOAD_MAX_SIZE:-104857600}
      IMAGE_SCAN_TEMP_ROOT: ${IMAGE_SCAN_TEMP_ROOT:-/tmp/sensitive-checker/images}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-models/erax_nsfw_yolo11m.pt}
      VIT_MODEL_NAME: ${VIT_MODEL_NAME:-AdamCodd/vit-base-nsfw-detector}
    volumes:
      - sensitive-checker-artifacts:/var/lib/sensitive-checker/music
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('SERVICE_PORT', '8000') + '/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  sensitive-checker-artifacts:
