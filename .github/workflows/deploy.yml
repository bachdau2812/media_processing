name: Build and deploy Media Processing

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push media processing image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ vars.MEDIA_PROCESSING_DOCKER_TARGET || 'runtime-cpu' }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/media_processing:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/media_processing:${{ github.sha }}

      - name: Config SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh-keyscan \
            -p "$SERVER_PORT" \
            "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy media processing
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'

            set -e

            cd /data/bachdd/ins_clone-deploy

            echo "Pulling media processing image..."
            docker compose pull media_processing

            echo "Starting media processing..."
            docker compose --env-file ../environment_variable/.env.backend \
              up -d --force-recreate media_processing

            echo "Current media processing container:"
            docker compose ps media_processing

          EOF
